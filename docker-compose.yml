services:
  app:
    build: .
    container_name: workout_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://workout_user:workout_pass@postgres:5432/workout_db
      JWT_SECRET: change_me_in_production
      JWT_EXPIRES_IN: 1h
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: workout_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workout_db
      POSTGRES_USER: workout_user
      POSTGRES_PASSWORD: workout_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout_user -d workout_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
